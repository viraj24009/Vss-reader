name: VSS Reader APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      # Download source code
      - name: Checkout
        uses: actions/checkout@v4

      # Java setup
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK setup
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # Gradle setup
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Verify SDK
      - name: Check Environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          adb version

      # Extract source
      - name: Extract Project
        run: |
          unzip -q VSSReader_Android_Project.zip -d source
          ls -la source/VSSReader

      # Build APK
      - name: Compile Android App
        run: |
          cd source/VSSReader
          gradle assembleDebug --no-daemon --stacktrace

      # Upload APK
      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSS-Reader-APK
          path: source/VSSReader/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
